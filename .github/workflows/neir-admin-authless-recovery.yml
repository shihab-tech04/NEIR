name: NEIR admin pre-authless independent full Git backup
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create, verify and restore full Git history
        shell: bash
        run: |
          set -euo pipefail
          PRE_RELEASE="12ba14b99da78a5296d9fca6c06414da5ea3d123"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$PRE_RELEASE"
          mkdir -p recovery
          git bundle create recovery/neir-admin-pre-authless-12ba14b9.bundle --all
          git bundle verify recovery/neir-admin-pre-authless-12ba14b9.bundle
          git clone recovery/neir-admin-pre-authless-12ba14b9.bundle /tmp/neir-restore
          git -C /tmp/neir-restore cat-file -e "$PRE_RELEASE^{commit}"
          for source in src/App.jsx src/components/layout/Header.jsx src/features/auth/AuthContext.jsx src/system/translations.js; do
            git show "$PRE_RELEASE:$source" > /tmp/pre-release-source
            git -C /tmp/neir-restore show "$PRE_RELEASE:$source" > /tmp/restored-source
            cmp /tmp/pre-release-source /tmp/restored-source
          done
          (cd recovery && sha256sum neir-admin-pre-authless-12ba14b9.bundle > bundle.sha256)
          printf 'source=shihab-tech04/NEIR\npre_release=%s\nrestore_test=PASS\nsource_comparison=PASS\n' "$PRE_RELEASE" > recovery/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NEIR-admin-pre-authless-full-git
          path: recovery/
          retention-days: 7
