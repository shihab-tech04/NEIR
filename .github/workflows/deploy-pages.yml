name: Build NEIR static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neir-static-publish-v2
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Vite source index
        run: cp index.source.html index.html

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production site
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: |
          npm run build
          printf '{"build":"%s"}\n' "$GITHUB_SHA" > dist/version.json

      - name: Publish compiled output to Pages branch source
        run: |
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/index.html ./index.html
          cp dist/logo.png ./logo.png
          cp dist/version.json ./version.json
          touch .nojekyll

      - name: Commit compiled site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer source commit exists. Skipping this stale compiled publish."
            exit 0
          fi
          git add index.html assets logo.png version.json .nojekyll
          if git diff --cached --quiet; then
            echo "Compiled site is already current."
          else
            git commit -m "chore: publish compiled NEIR site [skip ci]"
            git push origin HEAD:main
          fi
